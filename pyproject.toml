[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kg-pdg"
version = "0.1.0"
description = "Knowledge Graph Probe-Driven Growth — turns static knowledge graphs into living, self-growing ecosystems."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "KG-PDG Contributors"},
]
keywords = [
    "knowledge-graph",
    "ontology",
    "agent-skill",
    "probe-driven",
    "loop-engineering",
    "literature-recall",
    "evidence-grading",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Information Analysis",
]
dependencies = [
    "pydantic>=2.0",
    "networkx>=3.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.5",
]
medical = [
    "biopython>=1.83",
    "crossrefapi>=1.5",
]

[project.urls]
"Homepage" = "https://github.com/kg-pdg/kg-pdg"
"Repository" = "https://github.com/kg-pdg/kg-pdg"
"Documentation" = "https://github.com/kg-pdg/kg-pdg/tree/main/docs"
"Bug Tracker" = "https://github.com/kg-pdg/kg-pdg/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
